name: build-apk
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: unzip -q SeekDeep-Android.zip
      - run: chmod +x seekdeep-android/gradlew
      - run: cd seekdeep-android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SeekDeep-apk
          path: seekdeep-android/app/build/outputs/apk/debug/app-debug.apk
